# Fork-specific engine release build.
#
# The upstream (beyond-all-reason/RecoilEngine) build workflows depend on
# `nscloud-*` third-party runners that are not available on forks, so they
# would sit queued forever here. This workflow produces the same artifacts
# (`recoil_<version>_<platform>.7z`) using the same official build scripts
# (docker-build-v2/scripts/*) and the same public builder images
# (ghcr.io/beyond-all-reason/recoil-build-*), but runs on stock GitHub-hosted
# runners.
name: Build & Release unrecoil engine
on:
  push:
    branches:
      - master
    paths-ignore:
      - latest.json
  workflow_dispatch:
    inputs:
      version:
        description: 'Version the build reports and is released under (default 2026.07.04; must match the servers you join).'
        type: string
        required: false
      cmake-options:
        description: 'Custom CMake options passed to configure.sh'
        type: string
        required: false
      split-debug-info:
        description: 'Split debug info into a separate -dbgsym archive'
        type: boolean
        default: false

jobs:
  get-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.release-tag.outputs.tag_name }}
      build_id: ${{ steps.release-tag.outputs.build_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Pin release tag to this commit
        id: release-tag
        shell: bash
        env:
          TAG: ${{ inputs.version || '2026.07.04' }}
        run: |
          set -euo pipefail
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git tag -f -a -m "Version $TAG" "$TAG"
          git push --force origin "refs/tags/$TAG"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "build_id=$(git rev-parse --short=7 "${TAG}^{commit}")" >> "$GITHUB_OUTPUT"

  build-engine:
    needs: get-tag
    strategy:
      matrix:
        system:
          - target: amd64-linux
            image_digest: sha256:31b3667ba0d37620b4ad9b45d1840c8d3e95317f2b233044d2e17697ce8fe61d
          - target: amd64-windows
            image_digest: sha256:3ba630ac0c181a95dde522c3a4a81df2302914c7c4e6674e6bde0d4f6bf058ef
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The get-tag job guarantees an exact annotated tag at the commit we
          # build, so pin the checkout to it explicitly. The submodules are
          # fetched shallowly: nothing in the build reads their history (at most
          # mimalloc's optional git-describe define is omitted), so fetching the
          # pinned commits only is a large clone-time saving with identical trees.
          ref: ${{ needs.get-tag.outputs.tag_name }}
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
          shallow-submodules: true
          path: src

      - name: Verify clean detached checkout at tagged commit
        run: |
          set -euo pipefail
          git -C src checkout --detach HEAD
          actual="$(git -C src describe --exact-match --tags HEAD)"
          expected="${{ needs.get-tag.outputs.tag_name }}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Expected checkout at tag ${expected}, got ${actual}"
            exit 1
          fi

      - name: Restore ccache
        id: ccache
        uses: actions/cache@v4
        with:
          # The builder images bake in ccache (CMAKE_CXX_COMPILER_LAUNCHER) with
          # its cache_dir at /build/cache. Persisting that directory across runs
          # turns the multi-hour cold build into an incremental one. The save
          # happens automatically at the end of the job.
          path: cache
          key: unrecoil-ccache-${{ matrix.system.target }}

      - name: Build engine
        env:
          IMAGE: ghcr.io/beyond-all-reason/recoil-build-${{ matrix.system.target }}
          DIGEST: ${{ matrix.system.image_digest }}
          # Keep the on-disk cache comfortably below the 10GB actions/cache
          # per-key limit (the image default is 10G).
          CCACHE_MAXSIZE: 4G
        run: |
          mkdir -p artifacts cache
          docker pull "$IMAGE@$DIGEST"
          docker run -i --rm \
            -v /etc/passwd:/etc/passwd:ro \
            -v /etc/group:/etc/group:ro \
            --user="$(id -u):$(id -g)" \
            -v "$(pwd)/src:/build/src:ro" \
            -v "$(pwd)/cache:/build/cache:rw" \
            -v "$(pwd)/artifacts:/build/artifacts:rw" \
            "$IMAGE@$DIGEST" \
            bash <<'EOF'
          set -e
          cd /build/src/docker-build-v2/scripts
          ./configure.sh ${{ inputs.cmake-options || '' }}
          ./compile.sh
          ${{ inputs.split-debug-info && './split-debug-info.sh' || 'echo "Not splitting debug info."' }}
          ./package.sh
          ccache --show-stats || true
          EOF

      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-artifacts-${{ matrix.system.target }}
          path: ./artifacts
          compression-level: 0

  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [get-tag, build-engine]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: engine-artifacts-*
          merge-multiple: true

      - name: Rename artifacts to unrecoil prefix
        run: |
          for f in artifacts/recoil_*.7z; do
            base="${f##*/}"
            mv "$f" "artifacts/unrecoil_${base#recoil_}"
          done
          ls -la artifacts

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: ${{ needs.get-tag.outputs.tag_name }}
          name: ${{ needs.get-tag.outputs.tag_name }}

      - name: Update latest.json and push to master
        run: |
          set -euo pipefail
          tag="${{ needs.get-tag.outputs.tag_name }}"
          buildId="${{ needs.get-tag.outputs.build_id }}"
          engineFolder="${tag}"

          cat > latest.json <<EOF
          {
            "version": "${tag}",
            "engine": "${engineFolder}",
            "resources": [
              {
                "platform": "linux",
                "url": "https://github.com/PrivacyIsARight/unrecoil/releases/download/${tag}/unrecoil_${tag}_amd64-linux.7z",
                "destination": "engine/${engineFolder}",
                "extract": true
              },
              {
                "platform": "win32",
                "url": "https://github.com/PrivacyIsARight/unrecoil/releases/download/${tag}/unrecoil_${tag}_amd64-windows.7z",
                "destination": "engine/${engineFolder}",
                "extract": true
              }
            ]
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          if git diff --cached --quiet; then
            echo "latest.json is already up to date."
            exit 0
          fi
          git commit -s -m "Update latest.json to ${tag} (${buildId})" latest.json
          git pull --rebase origin master
          git push origin HEAD:master
